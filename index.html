<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajku - VIP Photo Card Engine</title>
    
    <!-- 🚨 FIREBASE SDKs (Database ke liye) 🚨 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #050505;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; flex-direction: column;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 20px; padding: 30px;
            width: 90%; max-width: 400px; text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
        }

        h1 { 
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0 0 5px 0; font-size: 32px; font-weight: 800;
        }
        
        p { color: #aaa; font-size: 13px; margin-bottom: 15px; }

        /* 48-HOUR FOMO TIMER STYLE */
        .fomo-timer {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        input[type="text"], input[type="tel"] {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: #111; border: 1px solid #d4af37;
            border-radius: 10px; color: white; font-size: 16px;
            box-sizing: border-box; text-transform: uppercase;
            outline: none; letter-spacing: 1px;
        }
        input:focus { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        .file-upload-wrapper { position: relative; margin-bottom: 20px; }
        .file-upload-btn {
            width: 100%; padding: 15px;
            background: rgba(212, 175, 55, 0.1); border: 1px dashed #d4af37;
            border-radius: 10px; color: #d4af37; font-size: 14px;
            cursor: pointer; box-sizing: border-box; transition: 0.3s;
        }
        .file-upload-btn:hover { background: rgba(212, 175, 55, 0.2); }
        input[type="file"] {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        button.generate-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728);
            border: none; border-radius: 10px; color: black;
            font-size: 16px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s;
        }
        button.generate-btn:hover { transform: scale(1.03); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }

        /* Canvas ab transparent background ke sath aayega */
        #cardCanvas {
            width: 90%; max-width: 600px;
            /* CSS border-radius hata diya kyunki ab Canvas khud gol katega */
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 30px rgba(212, 175, 55, 0.3);
            display: none;
            background: transparent;
        }

        .download-btn {
            background: #25D366; color: white; margin-top: 25px;
            display: none; width: 90%; max-width: 600px;
            padding: 16px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="control-panel" id="panel">
        <h1>Sajku Identity</h1>
        <p>Get Lifetime Free Delivery with this Card</p>
        
        <!-- THE SMART 48-HOUR FOMO TIMER -->
        <div class="fomo-timer" id="timerDisplay">Offer Ends In: 47h 59m 59s</div>
        
        <input type="text" id="userName" placeholder="Enter Full Name" maxlength="22" required>
        <input type="tel" id="userPhone" placeholder="WhatsApp Number" maxlength="10" required>
        
        <div class="file-upload-wrapper">
            <div class="file-upload-btn" id="uploadText">📸 Select Your Photo (Gallery)</div>
            <input type="file" id="userPhoto" accept="image/*" onchange="previewFileName()">
        </div>

        <button class="generate-btn" id="submitBtn" onclick="processCard()">Generate VIP Card</button>
    </div>

    <!-- The 4K Canvas -->
    <canvas id="cardCanvas" width="1000" height="630"></canvas>
    
    <button id="downloadBtn" class="download-btn" onclick="downloadCard()">📥 Download HD Card</button>

    <script>
        // ==========================================
        // 🚨 FIREBASE SETUP (TERA DATABASE) 🚨
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB24SehaHDOLuwzTLCkgCwXSpa6dVzrMOw",
            authDomain: "josh-de7d4.firebaseapp.com",
            databaseURL: "https://josh-de7d4-default-rtdb.firebaseio.com",
            projectId: "josh-de7d4",
            storageBucket: "josh-de7d4.firebasestorage.app",
            messagingSenderId: "1036207436233",
            appId: "1:1036207436233:web:59aa121374c9a89d4e3818"
        };

        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) {
            console.log("Firebase config abhi nahi daala hai. Local testing chal rahi hai.");
        }

        // ==========================================
        // SMART 48-HOUR FOMO TIMER LOGIC
        // ==========================================
        function startSmartTimer() {
            const duration = 48 * 60 * 60 * 1000; 
            let endTime = localStorage.getItem('sajku_vip_timer');
            
            if (!endTime || Date.now() > parseInt(endTime)) {
                endTime = Date.now() + duration;
                localStorage.setItem('sajku_vip_timer', endTime);
            }

            function updateTimer() {
                let now = Date.now();
                let distance = parseInt(endTime) - now;

                if (distance < 0) {
                    endTime = Date.now() + duration;
                    localStorage.setItem('sajku_vip_timer', endTime);
                    distance = duration;
                }

                let hours = Math.floor(distance / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((distance % (1000 * 60)) / 1000);

                let hStr = hours < 10 ? "0" + hours : hours;
                let mStr = minutes < 10 ? "0" + minutes : minutes;
                let sStr = seconds < 10 ? "0" + seconds : seconds;

                document.getElementById('timerDisplay').innerText = `Offer Ends In: ${hStr}h ${mStr}m ${sStr}s`;
            }
            updateTimer();
            setInterval(updateTimer, 1000);
        }
        startSmartTimer();

        // ==========================================
        // CARD GENERATION & FIREBASE LOGIC
        // ==========================================
        let uploadedImageObj = null;

        function previewFileName() {
            const fileInput = document.getElementById('userPhoto');
            const uploadText = document.getElementById('uploadText');
            
            if (fileInput.files && fileInput.files[0]) {
                uploadText.innerText = "✔ Photo Selected: " + fileInput.files[0].name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageObj = new Image();
                    uploadedImageObj.src = e.target.result;
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        async function processCard() {
            const nameInput = document.getElementById('userName').value.trim().toUpperCase();
            const phoneInput = document.getElementById('userPhone').value.trim();
            
            if(!nameInput) { alert("Bhai, pehle apna naam toh daal!"); return; }
            if(phoneInput.length < 10) { alert("Bhai, sahi WhatsApp number daal!"); return; }
            if(!uploadedImageObj) { alert("Bhai, ek mast si photo bhi select kar le!"); return; }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing..."; btn.disabled = true;

            const num1 = Math.floor(1000 + Math.random() * 9000);
            const num2 = Math.floor(1000 + Math.random() * 9000);
            const vipNumber = `SAJKU  ${num1}  ${num2}`;

            // 🚨 SAVE TO FIREBASE 🚨
            if (db) {
                try {
                    await db.collection("sajku_vip_members").add({
                        name: nameInput,
                        phone: phoneInput,
                        vipNumber: vipNumber,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (error) {}
            }

            if (uploadedImageObj.complete) {
                generateRoyalCard(nameInput, vipNumber);
            } else {
                uploadedImageObj.onload = () => generateRoyalCard(nameInput, vipNumber);
            }
        }

        function generateRoyalCard(nameInput, vipNumber) {
            const canvas = document.getElementById('cardCanvas');
            const ctx = canvas.getContext('2d');

            // Clear canvas completely to make it transparent
            ctx.clearRect(0, 0, 1000, 630);

            // ==========================================
            // ROOT CAUSE SOLUTION: CLIPPING MASK FOR ROUND CORNERS
            // ==========================================
            ctx.save(); // Save the state
            ctx.beginPath();
            // HTML5 roundRect API (x, y, width, height, radius)
            // 40px radius gives a perfect realistic credit card corner
            ctx.roundRect(0, 0, 1000, 630, 40); 
            ctx.clip(); // Ab jo bhi draw hoga, wo in gol kono ke andar hi hoga!

            // 1. BASE BLUE
            ctx.fillStyle = "#040A18"; 
            ctx.fillRect(0, 0, 1000, 630);

            // 2. CENTER RED MIX
            const centerGlow = ctx.createRadialGradient(500, 315, 0, 500, 315, 600);
            centerGlow.addColorStop(0, "rgba(90, 5, 15, 0.85)"); 
            centerGlow.addColorStop(1, "rgba(4, 10, 24, 0)"); 
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, 1000, 630);

            // 3. FOUR GOLDEN CORNERS
            const cornerRadius = 450;
            const corners =[{x: 0, y: 0}, {x: 1000, y: 0}, {x: 0, y: 630}, {x: 1000, y: 630}];
            corners.forEach(c => {
                const rg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, cornerRadius);
                rg.addColorStop(0, "rgba(212, 175, 55, 0.65)"); 
                rg.addColorStop(1, "rgba(212, 175, 55, 0)"); 
                ctx.fillStyle = rg;
                ctx.fillRect(0, 0, 1000, 630);
            });

            // 4. MATTE METAL TEXTURE (Noise)
            const imgData = ctx.getImageData(0, 0, 1000, 630);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 15; 
                data[i] = Math.min(255, Math.max(0, data[i] + noise));     
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise)); 
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise)); 
            }
            ctx.putImageData(imgData, 0, 0);

            // 5. DRAW USER PHOTO
            if (uploadedImageObj) {
                ctx.save();
                const photoX = 840; 
                const photoY = 160; 
                const radius = 85;  

                ctx.beginPath();
                ctx.arc(photoX, photoY, radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                const aspect = uploadedImageObj.width / uploadedImageObj.height;
                let drawW = radius * 2;
                let drawH = radius * 2;
                if (aspect > 1) { drawW = drawH * aspect; } 
                else { drawH = drawW / aspect; }
                
                ctx.drawImage(uploadedImageObj, photoX - drawW/2, photoY - drawH/2, drawW, drawH);
                ctx.restore();

                ctx.beginPath();
                ctx.arc(photoX, photoY, radius, 0, Math.PI * 2);
                ctx.lineWidth = 6;
                ctx.strokeStyle = "rgba(212, 175, 55, 0.9)";
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(photoX, photoY, radius - 3, 0, Math.PI * 2);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
                ctx.stroke();
            }

            // 6. METALLIC SHINE OVERLAY
            const shineGradient = ctx.createLinearGradient(0, 0, 1000, 630);
            shineGradient.addColorStop(0, "rgba(255, 255, 255, 0.15)");
            shineGradient.addColorStop(0.4, "rgba(255, 255, 255, 0.0)");
            shineGradient.addColorStop(0.6, "rgba(255, 255, 255, 0.0)");
            shineGradient.addColorStop(1, "rgba(212, 175, 55, 0.1)"); 
            ctx.fillStyle = shineGradient;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1000, 0); ctx.lineTo(0, 630); ctx.fill();

            // 7. REALISTIC EMV CHIP
            const chipX = 90; const chipY = 220;
            const chipGradient = ctx.createLinearGradient(chipX, chipY, chipX + 110, chipY + 85);
            chipGradient.addColorStop(0, "#e0c371"); chipGradient.addColorStop(0.5, "#b38728"); chipGradient.addColorStop(1, "#e0c371");
            ctx.fillStyle = chipGradient;
            ctx.beginPath(); ctx.roundRect(chipX, chipY, 110, 85, 12); ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 2; ctx.stroke();

            ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(chipX, chipY + 25); ctx.lineTo(chipX + 110, chipY + 25);
            ctx.moveTo(chipX, chipY + 60); ctx.lineTo(chipX + 110, chipY + 60);
            ctx.moveTo(chipX + 35, chipY); ctx.lineTo(chipX + 35, chipY + 85);
            ctx.moveTo(chipX + 75, chipY); ctx.lineTo(chipX + 75, chipY + 85);
            ctx.stroke();
            ctx.beginPath(); ctx.ellipse(chipX + 55, chipY + 42.5, 15, 25, 0, 0, Math.PI * 2); ctx.stroke();

            // 8. CONTACTLESS ICON
            ctx.strokeStyle = "rgba(212, 175, 55, 0.9)"; 
            ctx.lineWidth = 4; ctx.lineCap = "round";
            const cx = 250; const cy = 262;
            for(let i=1; i<=4; i++) {
                ctx.beginPath(); ctx.arc(cx - (i*10), cy, i*12, -Math.PI/4, Math.PI/4); ctx.stroke();
            }

            // 9. BRAND LOGO (Sajku)
            const logoGradient = ctx.createLinearGradient(500, 100, 700, 200);
            logoGradient.addColorStop(0, "#FBF5B7"); logoGradient.addColorStop(0.5, "#BF953F"); logoGradient.addColorStop(1, "#AA771C");
            ctx.font = "bold italic 85px 'Georgia', serif";
            ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillText("Sajku", 505, 165);
            ctx.fillStyle = logoGradient; ctx.fillText("Sajku", 500, 160);

            // 10. EMBOSSED TEXT (Name & Number)
            const numX = 90; const numY = 420; const nameY = 550;
            
            ctx.font = "bold 65px 'Courier New', monospace";
            ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillText(vipNumber, numX + 3, numY + 3); 
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fillText(vipNumber, numX - 2, numY - 2); 
            ctx.fillStyle = "#e8e8e8"; ctx.fillText(vipNumber, numX, numY); 

            ctx.font = "20px 'Arial', sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.fillText("FOUNDING MEMBER", 90, 490);
            ctx.fillText("VALID THRU", 750, 490);

            ctx.font = "bold 45px 'Courier New', monospace";
            ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillText(nameInput, 93, nameY + 3);
            ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillText(nameInput, 88, nameY - 2);
            ctx.fillStyle = "#d4af37"; ctx.fillText(nameInput, 90, nameY);

            const dateStr = "12/30";
            ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillText(dateStr, 753, nameY + 3);
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fillText(dateStr, 748, nameY - 2);
            ctx.fillStyle = "#e8e8e8"; ctx.fillText(dateStr, 750, nameY);

            // Restore the canvas context so clipping doesn't affect future draws
            ctx.restore();

            // SHOW CANVAS & BUTTONS
            document.getElementById('panel').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadCard() {
            const canvas = document.getElementById('cardCanvas');
            const link = document.createElement('a');
            // ROOT CAUSE SOLUTION: Download as PNG for transparent rounded corners
            link.download = 'Sajku_Identity_Card.png';
            link.href = canvas.toDataURL("image/png"); 
            link.click();
        }
    </script>

</body>
</html>
