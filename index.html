<!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajku - Official VIP Launch</title>
    
    <!-- html2canvas for High-Quality Screenshot & Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* 2026 Ultra-Premium Luxury UI/UX */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&family=Share+Tech+Mono&display=swap');

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #0a2e1f 0%, #010a07 100%);
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 24px; padding: 40px 30px;
            width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .logo-text {
            font-family: 'Playfair Display', serif; font-size: 52px;
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0; text-shadow: 0px 4px 15px rgba(255, 215, 0, 0.3);
        }

        .tagline {
            font-size: 12px; letter-spacing: 4px; color: #d4af37;
            text-transform: uppercase; margin-bottom: 30px; font-weight: 600;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 12px; color: #b3b3b3; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 1px;}
        
        input, select {
            width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px;
            color: white; font-size: 15px; font-family: 'Poppins', sans-serif;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }

        .gold-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #AA771C);
            border: none; border-radius: 12px; color: #000;
            font-size: 16px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; margin-top: 10px;
        }
        .gold-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(212, 175, 55, 0.4); }

        /* =========================================
           ADVANCED REALISTIC VIP CARD DESIGN
           ========================================= */
        .vip-card-wrapper { display: none; margin-top: 30px; }
        
        #captureCard {
            /* Real Credit Card Aspect Ratio */
            width: 100%; aspect-ratio: 1.586;
            background: linear-gradient(135deg, #041a11 0%, #0a3a2a 50%, #02120c 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 18px; padding: 25px;
            text-align: left; position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 20px 40px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Metallic Shine Overlay */
        #captureCard::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg);
        }

        .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        
        /* Realistic EMV Chip */
        .chip-container { display: flex; align-items: center; gap: 15px; }
        .chip {
            width: 45px; height: 35px;
            background: linear-gradient(135deg, #e0c371, #b38728);
            border-radius: 6px; position: relative;
            border: 1px solid #553a00; overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .chip::before {
            content: ''; position: absolute; top: 10px; left: 0; right: 0; height: 1px; background: rgba(0,0,0,0.3);
            box-shadow: 0 14px 0 rgba(0,0,0,0.3);
        }
        .chip::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: 15px; width: 1px; background: rgba(0,0,0,0.3);
            box-shadow: 14px 0 0 rgba(0,0,0,0.3);
        }

        /* Contactless Icon (SVG) */
        .contactless { width: 24px; height: 24px; opacity: 0.8; }

        .card-brand {
            font-family: 'Playfair Display', serif; color: #d4af37;
            font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Embossed Text Effect */
        .card-number {
            font-family: 'Share Tech Mono', monospace; font-size: 24px; color: #e8e8e8;
            letter-spacing: 3px; margin-bottom: 15px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.2), -1px -1px 0px rgba(0,0,0,0.8);
        }

        .card-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; }
        
        .card-holder-label { font-size: 9px; color: #a0a0a0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px;}
        .card-holder-name {
            font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #d4af37;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(255,215,0,0.3), -1px -1px 0px rgba(0,0,0,0.8);
        }

        .valid-thru { text-align: right; }
        .valid-date {
            font-family: 'Share Tech Mono', monospace; font-size: 16px; color: #e8e8e8;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.2), -1px -1px 0px rgba(0,0,0,0.8);
        }

        /* Action Buttons */
        .action-buttons { display: flex; gap: 10px; margin-top: 25px; }
        
        .whatsapp-btn, .download-btn {
            flex: 1; border: none; padding: 14px 10px;
            border-radius: 10px; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        
        .whatsapp-btn { background: #25D366; color: white; }
        .whatsapp-btn:hover { background: #1da851; }
        
        .download-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .download-btn:hover { background: rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <div class="glass-container">
        <h1 class="logo-text">Sajku</h1>
        <div class="tagline">Premium Fast Service</div>

        <div id="form-section">
            <p style="font-size: 13px; color: #ccc; margin-bottom: 25px; line-height: 1.6;">
                Join the Elite Club. Get exclusive access to premium electronics & beauty products.
            </p>
            
            <form id="sajkuForm" onsubmit="event.preventDefault(); processVIP();">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your name" required maxlength="20">
                </div>
                <div class="input-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="userPhone" placeholder="10-digit number" pattern="[0-9]{10}" required>
                </div>
                <div class="input-group">
                    <label>What are you looking for?</label>
                    <select id="userInterest" required>
                        <option value="" disabled selected>Select your interest</option>
                        <option value="Smartwatches & Earbuds">Smartwatches & Earbuds</option>
                        <option value="Premium Makeup & Beauty">Premium Makeup & Beauty</option>
                        <option value="Mobile Accessories">Mobile Accessories</option>
                    </select>
                </div>
                <button type="submit" class="gold-btn" id="submitBtn">Generate VIP Pass</button>
            </form>
        </div>

        <!-- The Generated VIP Card -->
        <div class="vip-card-wrapper" id="vipCardWrapper">
            <!-- Is div ka screenshot liya jayega -->
            <div id="captureCard">
                <div class="card-top-row">
                    <div class="chip-container">
                        <div class="chip"></div>
                        <!-- Contactless SVG Icon -->
                        <svg class="contactless" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8.5 16.5a7.5 7.5 0 0 1 0-9"></path>
                            <path d="M12 19.5a11.5 11.5 0 0 1 0-15"></path>
                            <path d="M15.5 22.5a15.5 15.5 0 0 1 0-21"></path>
                        </svg>
                    </div>
                    <div class="card-brand">Sajku</div>
                </div>
                
                <div class="card-number" id="cardNumber">SAJKU 0000 0000</div>
                
                <div class="card-bottom-row">
                    <div>
                        <div class="card-holder-label">Founding Member</div>
                        <div class="card-holder-name" id="cardName">JOHN DOE</div>
                    </div>
                    <div class="valid-thru">
                        <div class="card-holder-label">Valid Thru</div>
                        <div class="valid-date">12/30</div>
                    </div>
                </div>
            </div>
            
            <p style="font-size: 13px; color: #4CAF50; margin-top: 20px; font-weight: bold;" id="successMsg">✔ VIP Pass Activated!</p>
            
            <div class="action-buttons">
                <button class="download-btn" id="downloadBtn" onclick="downloadCard()">
                    📥 Download
                </button>
                <button class="whatsapp-btn" id="shareBtn" onclick="shareCardAsImage()">
                    📲 Share Status
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Setup (Keep your config here when ready)
        const firebaseConfig = {
            apiKey: "AIzaSyB24SehaHDOLuwzTLCkgCwXSpa6dVzrMOw",
            authDomain: "josh-de7d4.firebaseapp.com",
            databaseURL: "https://josh-de7d4-default-rtdb.firebaseio.com",
            projectId: "josh-de7d4",
            storageBucket: "josh-de7d4.firebasestorage.app",
            messagingSenderId: "1036207436233",
            appId: "1:1036207436233:web:59aa121374c9a89d4e3818"
        };
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) { console.log("Local testing mode."); }

        async function processVIP() {
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing..."; btn.disabled = true;

            const name = document.getElementById('userName').value;
            
            // Generate VIP Number
            const num1 = Math.floor(1000 + Math.random() * 9000);
            const num2 = Math.floor(1000 + Math.random() * 9000);
            const vipNumber = `SAJKU ${num1} ${num2}`;

            // Update UI
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('vipCardWrapper').style.display = 'block';
            
            document.getElementById('cardName').innerText = name;
            document.getElementById('cardNumber').innerText = vipNumber;
        }

        // 📥 NEW FEATURE: Download Card to Gallery
        async function downloadCard() {
            const btn = document.getElementById('downloadBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Saving...";
            
            const cardElement = document.getElementById('captureCard');
            
            try {
                // Scale 3 means Ultra HD (3x resolution)
                const canvas = await html2canvas(cardElement, { scale: 3, backgroundColor: null });
                const link = document.createElement('a');
                link.download = 'Sajku_Premium_VIP.jpg';
                link.href = canvas.toDataURL("image/jpeg", 1.0);
                link.click();
                
                btn.innerHTML = "✔ Downloaded";
                setTimeout(() => btn.innerHTML = originalText, 2000);
            } catch (error) {
                console.error(error);
                alert("Download failed.");
                btn.innerHTML = originalText;
            }
        }

        // 📲 Share to WhatsApp
        async function shareCardAsImage() {
            const btn = document.getElementById('shareBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Wait...";
            
            const cardElement = document.getElementById('captureCard');
            
            try {
                const canvas = await html2canvas(cardElement, { scale: 3, backgroundColor: null });
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], "Sajku_VIP.jpg", { type: "image/jpeg" });
                    const shareData = {
                        title: 'Sajku VIP',
                        text: 'I just got my Sajku Premium VIP Card! ✨',
                        files: [file]
                    };

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share(shareData);
                    } else {
                        alert("Direct share not supported. Please use the Download button and share manually.");
                    }
                    btn.innerHTML = originalText;
                }, 'image/jpeg', 1.0);
            } catch (error) {
                console.error(error);
                btn.innerHTML = originalText;
            }
        }
    </script>

</body>
</html>
