<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajku - Official VIP Launch</title>
    
    <!-- Root Cause Solution: html2canvas library for taking screenshot of the card -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Firebase SDKs (Firebase 9+ Modular approach via compat for simple HTML) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* 2026 Premium Luxury UI/UX */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #0a3a2a 0%, #02120c 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-shadow: 0px 4px 10px rgba(255, 215, 0, 0.2);
        }

        .tagline {
            font-size: 12px;
            letter-spacing: 3px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 12px; color: #a0a0a0; margin-bottom: 5px; display: block; text-transform: uppercase; }
        
        input, select {
            width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 12px;
            color: white; font-size: 16px; font-family: 'Poppins', sans-serif;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: #d4af37; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

        .gold-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728);
            border: none; border-radius: 12px; color: #000;
            font-size: 18px; font-weight: 600; cursor: pointer;
            text-transform: uppercase; transition: 0.2s; margin-top: 10px;
        }
        .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3); }

        /* VIP Card Design */
        .vip-card-wrapper { display: none; margin-top: 20px; }
        
        /* Card jiska screenshot lena hai */
        #captureCard {
            background: linear-gradient(135deg, #111, #1a3a2a);
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 25px;
            text-align: left;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 100%;
            box-sizing: border-box;
        }

        .chip { width: 40px; height: 30px; background: linear-gradient(135deg, #e0c371, #b38728); border-radius: 5px; margin-bottom: 20px; }
        .card-brand { position: absolute; top: 25px; right: 25px; font-family: 'Playfair Display', serif; color: #d4af37; font-size: 24px; font-weight: bold; }
        .card-number { font-family: 'Courier New', Courier, monospace; font-size: 20px; color: #fff; letter-spacing: 2px; margin-bottom: 15px; }
        .card-holder-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .card-holder-name { font-size: 18px; color: #d4af37; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}

        .whatsapp-btn {
            background: #25D366; color: white; border: none; padding: 15px;
            width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold;
            margin-top: 20px; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1 class="logo-text">Sajku</h1>
        <div class="tagline">Premium Fast Service</div>

        <div id="form-section">
            <p style="font-size: 14px; color: #ccc; margin-bottom: 25px;">
                Join the Elite Club. Get exclusive access to premium electronics & beauty products.
            </p>
            
            <form id="sajkuForm" onsubmit="event.preventDefault(); processVIP();">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="userPhone" placeholder="10-digit number" pattern="[0-9]{10}" required>
                </div>
                <div class="input-group">
                    <label>What are you looking for?</label>
                    <select id="userInterest" required>
                        <option value="" disabled selected>Select your interest</option>
                        <option value="Smartwatches & Earbuds">Smartwatches & Earbuds</option>
                        <option value="Premium Makeup & Beauty">Premium Makeup & Beauty</option>
                        <option value="Mobile Accessories">Mobile Accessories</option>
                    </select>
                </div>
                <button type="submit" class="gold-btn" id="submitBtn">Generate VIP Pass</button>
            </form>
        </div>

        <!-- The Generated VIP Card -->
        <div class="vip-card-wrapper" id="vipCardWrapper">
            <!-- Is div ka screenshot liya jayega -->
            <div id="captureCard">
                <div class="chip"></div>
                <div class="card-brand">Sajku</div>
                <div class="card-number" id="cardNumber">SAJKU 0000 0000</div>
                <div class="card-holder-label">Founding Member</div>
                <div class="card-holder-name" id="cardName">JOHN DOE</div>
            </div>
            
            <p style="font-size: 12px; color: #4CAF50; margin-top: 15px;" id="successMsg">✔ VIP Pass Activated & Saved to Server!</p>
            
            <button class="whatsapp-btn" id="shareBtn" onclick="shareCardAsImage()">
                📸 Share Card on WhatsApp Status
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 FIREBASE SETUP (TERA DATABASE) 🚨
        // ==========================================
        // Bhai, Firebase console se apna config yahan paste karna hai
        const firebaseConfig = {
            apiKey: "AIzaSyB24SehaHDOLuwzTLCkgCwXSpa6dVzrMOw",
            authDomain: "josh-de7d4.firebaseapp.com",
            databaseURL: "https://josh-de7d4-default-rtdb.firebaseio.com",
            projectId: "josh-de7d4",
            storageBucket: "josh-de7d4.firebasestorage.app",
            messagingSenderId: "1036207436233",
            appId: "1:1036207436233:web:59aa121374c9a89d4e3818"
        };

        // Initialize Firebase (Agar config khali hai toh error na aaye isliye try-catch)
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) {
            console.log("Firebase config abhi nahi daala hai. Local testing chal rahi hai.");
        }

        // ==========================================
        // LOGIC: Generate Card & Save to Firebase
        // ==========================================
        async function processVIP() {
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const interest = document.getElementById('userInterest').value;

            // Generate VIP Number
            const num1 = Math.floor(1000 + Math.random() * 9000);
            const num2 = Math.floor(1000 + Math.random() * 9000);
            const vipNumber = `SAJKU ${num1} ${num2}`;

            // Save to Firebase Firestore
            if (db) {
                try {
                    await db.collection("vip_members").add({
                        name: name,
                        phone: phone,
                        interest: interest,
                        vipNumber: vipNumber,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (error) {
                    console.error("Error saving to Firebase: ", error);
                }
            }

            // Update UI
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('vipCardWrapper').style.display = 'block';
            document.getElementById('shareBtn').style.display = 'block';
            
            document.getElementById('cardName').innerText = name;
            document.getElementById('cardNumber').innerText = vipNumber;
        }

        // ==========================================
        // ELITE JUGAAD: Convert HTML to Image & Share
        // ==========================================
        async function shareCardAsImage() {
            const shareBtn = document.getElementById('shareBtn');
            shareBtn.innerText = "Generating Image... ⏳";
            
            const cardElement = document.getElementById('captureCard');
            
            try {
                // 1. Take Screenshot of the Card
                const canvas = await html2canvas(cardElement, {
                    scale: 2, // High Quality Image
                    backgroundColor: "#111111"
                });

                // 2. Convert Canvas to Blob (File)
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], "Sajku_VIP_Card.jpg", { type: "image/jpeg" });
                    
                    const shareData = {
                        title: 'Sajku VIP Member',
                        text: 'I just became a Founding VIP Member of Sajku! Get yours before the waitlist closes! ✨',
                        files: [file] // YAHAN PHOTO ATTACH HO RAHI HAI!
                    };

                    // 3. Check if mobile browser supports sharing files
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share(shareData);
                        shareBtn.innerText = "📸 Share Card on WhatsApp Status";
                    } else {
                        // Fallback for Desktop or old browsers: Download the image
                        alert("Aapka browser direct share support nahi karta. Card download ho raha hai, isko WhatsApp par laga lijiye!");
                        const link = document.createElement('a');
                        link.download = 'Sajku_VIP_Card.jpg';
                        link.href = canvas.toDataURL("image/jpeg");
                        link.click();
                        shareBtn.innerText = "📸 Share Card on WhatsApp Status";
                    }
                }, 'image/jpeg', 0.9);

            } catch (error) {
                console.error("Error generating image: ", error);
                alert("Image banne mein error aayi.");
                shareBtn.innerText = "📸 Share Card on WhatsApp Status";
            }
        }
    </script>

</body>
</html>
